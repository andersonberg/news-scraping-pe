[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-scraping-pe"
version = "0.1.0"
description = "Coleta histórica de notícias sobre ações judiciais contra candidatos (PE / BR, 2018 e 2022)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anderson Berg" }]
keywords = ["scrapy", "news", "elections", "brazil", "pernambuco"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "scrapy>=2.11,<3",
  "trafilatura>=2.0,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
playwright = ["scrapy-playwright>=0.0.40,<1"]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
  "types-jsonschema>=4.23,<5",
  "pre-commit>=4.0,<5",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
news-scraping-pe = "news_scraping_pe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/news_scraping_pe"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["news_scraping_pe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["news_scraping_pe"]
package = ["news_scraping_pe"]
